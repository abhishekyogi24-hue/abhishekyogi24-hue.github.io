<!-- Chatbot widget -->
<div id="chat-widget">
  <div id="chat-frame-wrap" hidden>
    <iframe id="chat-frame" title="Ask about Abhishek" loading="lazy"></iframe>
  </div>
  <button id="chat-launcher" type="button" aria-label="Open chat" aria-expanded="false">
    <svg class="icon-open" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <svg class="icon-close" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<script>
(function () {
  var launcher = document.getElementById('chat-launcher');
  var wrap = document.getElementById('chat-frame-wrap');
  var frame = document.getElementById('chat-frame');
  var widget = document.getElementById('chat-widget');
  var loaded = false;

  function open() {
    if (!loaded) { frame.src = 'chatbot.html'; loaded = true; }
    wrap.hidden = false;
    // allow display to apply before animating
    requestAnimationFrame(function () { widget.classList.add('open'); });
    launcher.setAttribute('aria-label', 'Close chat');
    launcher.setAttribute('aria-expanded', 'true');
  }
  function close() {
    widget.classList.remove('open');
    launcher.setAttribute('aria-label', 'Open chat');
    launcher.setAttribute('aria-expanded', 'false');
    setTimeout(function () { if (!widget.classList.contains('open')) wrap.hidden = true; }, 200);
  }
  launcher.addEventListener('click', function () {
    if (widget.classList.contains('open')) close(); else open();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && widget.classList.contains('open')) close();
  });
})();
</script>
